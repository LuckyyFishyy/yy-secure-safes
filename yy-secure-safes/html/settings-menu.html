<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .menu-container {
            background: rgba(30, 30, 30, 0.95);
            border: 2px solid #00ff00;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            padding: 20px;
            display: none;
        }
        
        .menu-container.active {
            display: block;
        }
        
        .menu-title {
            color: #00ff00;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 10px;
        }
        
        .menu-option {
            padding: 12px;
            margin: 5px 0;
            background: rgba(50, 50, 50, 0.8);
            border: 1px solid #333;
            border-radius: 4px;
            color: #ccc;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
        }
        
        .menu-option:hover,
        .menu-option.selected {
            background: #00ff00;
            color: #000;
            border-color: #00ff00;
            font-weight: bold;
        }
        
        .menu-option-title {
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        
        .menu-option-desc {
            font-size: 12px;
            opacity: 0.8;
        }
        
        .menu-footer {
            border-top: 1px solid #333;
            margin-top: 10px;
            padding-top: 10px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="menu-container" id="settingsMenu">
        <div class="menu-title">Safe Settings</div>
        <div class="menu-option" data-action="change-passcode">
            <span class="menu-option-title">Change Passcode</span>
            <span class="menu-option-desc">Set a new passcode for your safe</span>
        </div>
        <div class="menu-option" id="keyOption" data-action="craft-key">
            <span class="menu-option-title">Craft Safe Key</span>
            <span class="menu-option-desc">Turn a blank key into a safe key</span>
        </div>
        <div class="menu-option" data-action="move-safe">
            <span class="menu-option-title">Move Safe</span>
            <span class="menu-option-desc">Relocate your safe (must be empty)</span>
        </div>
        <div class="menu-footer">Press [ENTER] to select, [ESC] to close</div>
    </div>

    <script>
        let selectedIndex = 0;
        let currentSafeId = null;
        let menuActive = false;

        window.addEventListener('message', (event) => {
            const data = event.data;
            
            if (data.action === 'openSettingsMenu') {
                currentSafeId = data.safeId;
                menuActive = true;
                selectedIndex = 0;
                document.getElementById('settingsMenu').classList.add('active');
                updateMenuSelection();
            } else if (data.action === 'closeSettingsMenu') {
                menuActive = false;
                document.getElementById('settingsMenu').classList.remove('active');
                currentSafeId = null;
            }
        });

        document.querySelectorAll('.menu-option').forEach((option, index) => {
            option.addEventListener('click', () => {
                selectedIndex = index;
                updateMenuSelection();
                selectOption();
            });
        });

        function updateMenuSelection() {
            document.querySelectorAll('.menu-option').forEach((option, index) => {
                if (index === selectedIndex) {
                    option.classList.add('selected');
                } else {
                    option.classList.remove('selected');
                }
            });
        }

        function selectOption() {
            const options = document.querySelectorAll('.menu-option');
            const action = options[selectedIndex].dataset.action;
            
            fetch(`https://${GetParentResourceName()}/settingsMenuAction`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: action,
                    safeId: currentSafeId
                })
            });
            
            menuActive = false;
            document.getElementById('settingsMenu').classList.remove('active');
        }

        document.addEventListener('keydown', (event) => {
            if (!menuActive) return;
            
            const options = document.querySelectorAll('.menu-option');
            
            if (event.key === 'ArrowUp') {
                selectedIndex = (selectedIndex - 1 + options.length) % options.length;
                updateMenuSelection();
            } else if (event.key === 'ArrowDown') {
                selectedIndex = (selectedIndex + 1) % options.length;
                updateMenuSelection();
            } else if (event.key === 'Enter') {
                selectOption();
            } else if (event.key === 'Escape') {
                menuActive = false;
                document.getElementById('settingsMenu').classList.remove('active');
                fetch(`https://${GetParentResourceName()}/closeSettingsMenu`, {
                    method: 'POST'
                });
            }
        });
    </script>
</body>
</html>
